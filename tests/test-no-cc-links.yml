name: Test GCC installation without cc symlinks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: '0'
        continue-on-error: true

      - name: Assert action ran (pwsh required; may fail gracefully if not available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GCC_OUT: ${{ steps.action.outputs.gcc }}
          GXX_OUT: ${{ steps.action.outputs.gxx }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gcc output: $GCC_OUT"
          echo "gxx output: $GXX_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GCC_OUT" ]; then
              echo "FAIL: action succeeded but gcc output is empty"
              exit 1
            fi
            if [ -z "$GXX_OUT" ]; then
              echo "FAIL: action succeeded but gxx output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with gcc=$GCC_OUT gxx=$GXX_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (pwsh not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert gcc binary is available (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GCC_BIN: ${{ steps.action.outputs.gcc }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping binary check"
            exit 0
          fi
          echo "Checking binary: $GCC_BIN"
          if ! command -v "$GCC_BIN" > /dev/null 2>&1; then
            echo "FAIL: $GCC_BIN not found on PATH"
            exit 1
          fi
          echo "PASS: $GCC_BIN is available"
          "$GCC_BIN" --version

      - name: Assert gxx binary is available (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GXX_BIN: ${{ steps.action.outputs.gxx }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping binary check"
            exit 0
          fi
          echo "Checking binary: $GXX_BIN"
          if ! command -v "$GXX_BIN" > /dev/null 2>&1; then
            echo "FAIL: $GXX_BIN not found on PATH"
            exit 1
          fi
          echo "PASS: $GXX_BIN is available"
          "$GXX_BIN" --version

      - name: Assert /usr/local/bin/cc symlink was NOT created (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping symlink check"
            exit 0
          fi
          # When cc=0, the action should NOT create /usr/local/bin/cc symlink
          if [ -f /usr/local/bin/cc ] || [ -L /usr/local/bin/cc ]; then
            echo "FAIL: /usr/local/bin/cc was created but cc=0 was set"
            exit 1
          fi
          echo "PASS: /usr/local/bin/cc was not created by the action"

      - name: Assert /usr/local/bin/c++ symlink was NOT created (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping symlink check"
            exit 0
          fi
          if [ -f /usr/local/bin/c++ ] || [ -L /usr/local/bin/c++ ]; then
            echo "FAIL: /usr/local/bin/c++ was created but cc=0 was set"
            exit 1
          fi
          echo "PASS: /usr/local/bin/c++ was not created by the action"
