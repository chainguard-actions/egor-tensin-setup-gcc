name: Test GCC install with cc symlinks disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell if needed
        run: |
          if which pwsh > /dev/null 2>&1; then
            echo "pwsh already available"
            pwsh --version
            exit 0
          fi
          echo "Installing PowerShell..."
          # Detect if running as root
          if [ "$(id -u)" = "0" ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi
          $SUDO apt-get update -q
          $SUDO apt-get install -yq wget apt-transport-https software-properties-common lsb-release
          UBUNTU_VERSION=$(lsb_release -rs)
          wget -q "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
          $SUDO dpkg -i /tmp/packages-microsoft-prod.deb
          $SUDO apt-get update -q
          $SUDO apt-get install -yq powershell
          pwsh --version
        shell: bash
      - name: Remove any pre-existing cc symlink
        run: |
          if [ "$(id -u)" = "0" ]; then
            rm -f /usr/local/bin/cc /usr/local/bin/c++ || true
          else
            sudo rm -f /usr/local/bin/cc /usr/local/bin/c++ || true
          fi
      - id: install
        uses: .
        with:
          version: latest
          platform: x64
          cc: 0
      - name: Assert gcc output
        env:
          ACTUAL: ${{ steps.install.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ "$ACTUAL" != "gcc" ]; then
            echo "FAIL: expected gcc output to be 'gcc', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert gxx output
        env:
          ACTUAL: ${{ steps.install.outputs.gxx }}
        run: |
          echo "actual gxx: $ACTUAL"
          if [ "$ACTUAL" != "g++" ]; then
            echo "FAIL: expected gxx output to be 'g++', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert gcc binary is available
        run: |
          which gcc
          gcc --version
          echo "PASS: gcc is available"
      - name: Assert g++ binary is available
        run: |
          which g++
          g++ --version
          echo "PASS: g++ is available"
      - name: Assert cc symlink was NOT created by action
        run: |
          if [ -f /usr/local/bin/cc ]; then
            echo "FAIL: /usr/local/bin/cc should not have been created when cc=0"
            exit 1
          fi
          echo "PASS: cc symlink was not created"
