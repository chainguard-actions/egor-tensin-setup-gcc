name: Test basic usage (latest, x64, cc links)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure pwsh is available
        run: |
          if command -v pwsh >/dev/null 2>&1; then pwsh --version; exit 0; fi
          command -v curl >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -yq curl ca-certificates; }
          ver=7.4.6
          case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=x64 ;; esac
          curl -sSfL -o /tmp/pwsh.tar.gz "https://github.com/PowerShell/PowerShell/releases/download/v${ver}/powershell-${ver}-linux-${arch}.tar.gz"
          sudo mkdir -p /opt/microsoft/powershell/7
          sudo tar -xzf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
          sudo chmod +x /opt/microsoft/powershell/7/pwsh
          sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> "$GITHUB_ENV"
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 pwsh --version
      - id: action
        uses: .
      - name: Assert outputs
        env:
          GCC: ${{ steps.action.outputs.gcc }}
          GXX: ${{ steps.action.outputs.gxx }}
        run: |
          echo "gcc: $GCC"; echo "gxx: $GXX"
          if [ "$GCC" != "gcc" ]; then echo "FAIL: expected gcc"; exit 1; fi
          if [ "$GXX" != "g++" ]; then echo "FAIL: expected g++"; exit 1; fi
          echo "PASS"
      - name: Assert cc/c++ links and compilers work
        run: |
          ls -l /usr/local/bin/cc /usr/local/bin/c++ || true
          if [ ! -L /usr/local/bin/cc ] || [ ! -L /usr/local/bin/c++ ]; then
            echo "FAIL: cc/c++ symlinks missing in /usr/local/bin"; exit 1
          fi
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          printf '#include <iostream>\nint main(){std::cout<<"hi\\n";}\n' > /tmp/t.cpp
          cc /tmp/t.c -o /tmp/tc && /tmp/tc || { echo "FAIL: cc compile"; exit 1; }
          c++ /tmp/t.cpp -o /tmp/tcpp && /tmp/tcpp | grep -q hi || { echo "FAIL: c++ compile"; exit 1; }
          echo "PASS"
