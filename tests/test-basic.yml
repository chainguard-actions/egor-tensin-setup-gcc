name: Test basic GCC installation (latest, x64, cc=1)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends \
              wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          fi
          pwsh --version

      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: 1

      - name: Assert gcc output is 'gcc'
        env:
          ACTUAL: ${{ steps.action.outputs.gcc }}
        run: |
          echo "actual gcc: $ACTUAL"
          if [ "$ACTUAL" != "gcc" ]; then
            echo "FAIL: expected gcc output to be 'gcc', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert gxx output is 'g++'
        env:
          ACTUAL: ${{ steps.action.outputs.gxx }}
        run: |
          echo "actual gxx: $ACTUAL"
          if [ "$ACTUAL" != "g++" ]; then
            echo "FAIL: expected gxx output to be 'g++', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert gcc binary is available
        run: |
          which gcc
          gcc --version
          echo "PASS: gcc is available"

      - name: Assert g++ binary is available
        run: |
          which g++
          g++ --version
          echo "PASS: g++ is available"

      - name: Assert cc symlink is available
        run: |
          which cc
          cc --version
          echo "PASS: cc symlink is available"

      - name: Assert c++ symlink is available
        run: |
          which c++
          c++ --version
          echo "PASS: c++ symlink is available"

      - name: Assert can compile a C program
        run: |
          echo 'int main() { return 0; }' > /tmp/test.c
          gcc /tmp/test.c -o /tmp/test_c
          /tmp/test_c
          echo "PASS: C compilation succeeded"

      - name: Assert can compile a C++ program
        run: |
          echo '#include <iostream>
          int main() { std::cout << "hello" << std::endl; return 0; }' > /tmp/test.cpp
          g++ /tmp/test.cpp -o /tmp/test_cpp
          /tmp/test_cpp
          echo "PASS: C++ compilation succeeded"
